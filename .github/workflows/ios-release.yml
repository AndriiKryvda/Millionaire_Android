# Builds the unsigned iOS .ipa on a macOS runner and publishes it into releases/iOS/.
# iOS artifacts cannot be produced on Windows, so this workflow is the official build path.
name: iOS Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned .ipa (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Read app version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^appVersionName=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building iOS version $VERSION"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec iosApp/project.yml

      - name: Build Release (unsigned)
        run: |
          chmod +x ./gradlew
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''

      - name: Package .ipa
        run: |
          APP=$(find iosApp/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry millionaire.ipa Payload

      - name: Publish into releases/iOS and push
        run: |
          find releases/iOS -maxdepth 1 -name '*.ipa' -delete
          mv millionaire.ipa "releases/iOS/millionaire-${{ steps.version.outputs.name }}-unsigned.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/iOS
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping commit."
          else
            git commit -m "build: publish iOS ${{ steps.version.outputs.name }} unsigned .ipa (CI)"
            git push
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: millionaire-ios-unsigned
          path: releases/iOS/*.ipa
